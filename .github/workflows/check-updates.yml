name: Verificar atualizações do Workshop

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-modpack
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências Python
        run: python -m pip install --requirement requirements.txt
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Instalar SteamCMD
        shell: bash
        run: |
          sudo add-apt-repository multiverse -y
          sudo dpkg --add-architecture i386
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y steamcmd
      - name: Verificar e publicar alterações
        env:
          GH_TOKEN: ${{ github.token }}
          STEAMCMD_PATH: /usr/games/steamcmd
        run: python -m scripts.pipeline
      - name: Salvar manifesto publicado
        shell: bash
        run: |
          if git diff --quiet -- manifest.json; then exit 0; fi
          published_manifest="$(mktemp)"
          cp manifest.json "$published_manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$published_manifest" manifest.json
            if git diff --quiet -- manifest.json; then exit 0; fi
            git add manifest.json
            git commit -m "chore: atualizar manifesto publicado [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Não foi possível sincronizar manifest.json após 3 tentativas." >&2
          exit 1

