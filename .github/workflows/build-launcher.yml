name: Build do launcher Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"
  push:
    branches:
      - "feature/launcher"
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restaurar dependências
        run: dotnet restore launcher/L4D2ModManager.slnx
      - name: Executar testes
        run: dotnet test launcher/L4D2ModManager.slnx -c Release --no-restore
      - name: Publicar executável
        run: dotnet publish launcher/src/L4D2ModManager.Desktop/L4D2ModManager.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher/artifacts/win-x64
      - name: Enviar artifact
        uses: actions/upload-artifact@v4
        with:
          name: L4D2ModManager-win-x64
          path: launcher/artifacts/win-x64/**
          if-no-files-found: error
